<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bounce Focus - Multitasking vs Focus</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <section class="animation-section" id="multitasking-section">
            <h2 class="title">Multitasking</h2>
            <div class="canvas-wrapper">
                <canvas id="multitasking-canvas"></canvas>
            </div>
        </section>

        <section class="animation-section" id="focus-section">
            <h2 class="title">Focus</h2>
            <div class="canvas-wrapper">
                <canvas id="focus-canvas"></canvas>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
